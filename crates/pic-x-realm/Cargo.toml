[package]
name = "pic-x-realm"
description = "The public PIC-X surface: the server control plane and per-realm issuer discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["json"] }
pic-x-core.workspace = true
pic-x-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
pic-x-std = { workspace = true, default-features = false, features = ["audit", "storage"] }
tower = { workspace = true, features = ["util"] }
