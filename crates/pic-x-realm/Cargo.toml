[package]
name = "pic-x-realm"
description = "The public PIC-X surface: the server control plane and per-realm issuer discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["json"] }
base64.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
pic-protocol.workspace = true
pic-x-core.workspace = true
pic-x-transport.workspace = true
regex.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
ed25519-dalek = "2"
pic-x-std = { workspace = true, default-features = false, features = ["audit", "storage"] }
tower = { workspace = true, features = ["util"] }
