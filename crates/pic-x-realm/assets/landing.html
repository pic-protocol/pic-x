<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      :root {
        --bg: #111111;
        --fg: #e7eaee;
        --muted: #8b939d;
        --line: #2b2b2b;
        --card: #1a1a1a;
        --accent: #3b82f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.25rem;
      }
      .card {
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      .logo {
        width: min(260px, 72%);
        height: auto;
        margin: 0 auto 1.25rem;
        display: block;
      }
      .wordmark {
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        margin: 0 0 0.5rem;
        background: linear-gradient(90deg, #34d3a6, #3b82f6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        color: var(--muted);
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        margin-bottom: 1.75rem;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        text-align: left;
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        text-decoration: none;
        color: var(--fg);
        background: var(--card);
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .row:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      .row .label {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .row .path {
        color: var(--muted);
        font-size: 0.82rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      .foot {
        margin-top: 2rem;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      {{HERO}}
      <div class="subtitle">{{SUBTITLE}}</div>
      <nav class="links">{{ROWS}}</nav>
      <div class="foot">{{FOOT}}</div>
    </main>
  </body>
</html>
