## PIC-X — every setting there is, what it does, and what happens if you get it wrong.
##
## Nothing here runs. This is the catalogue you copy from; the files that run are:
##
##   config.local.yml       the binary, no transport security     — `task run-as-local`
##   config.local-tls.yml   the binary, TLS and mutual TLS        — `task run-as-local-tls`
##   config.docker.yml      one container, no transport security  — `task run-as-docker`
##   config.docker-tls.yml  one container, TLS and mutual TLS     — `task run-as-docker-tls`
##   config.lab.yml         the local Docker Compose lab          — `task lab-up`
##
## A production configuration is written by copying from this file; the container image ships no
## configuration at all and refuses to start until one is mounted at /etc/pic-x/config.yml.
##
## ## How to read this file
##
## Lines starting with `##` are prose. Lines starting with `# ` are settings, commented out. Removing
## the `# ` from every one of them yields a valid configuration — and a test does exactly that, then
## starts a server from it. That is what stops this file from drifting away from the code: it cannot
## document a setting that no longer exists, or miss one that does.
##
## ## Where a value can come from
##
## Five layers, each overwriting only what it actually declares: built-in defaults, build metadata,
## this file, the environment, then the command line.
##
## So `PIC_X_LOG_LEVEL` beats `log.level` written here, and `--log-level` beats both. That order is
## deliberate: a file travels with the build — baked into an image, copied between environments — so
## it describes the *product*, while the environment is set by whoever is running this particular
## instance and describes the *deployment*. When they disagree, the deployment knows something the
## file could not.

## ---------------------------------------------------------------------------------------------
## The volume
## ---------------------------------------------------------------------------------------------
##
## Everything this deployment keeps lives inside one directory, and every relative path below is
## resolved against it. The server creates it on start. One setting instead of one per kind of file,
## because they were never independent: a deployment that moved its secrets moved all of it.
##
##   <working_dir>/operations   the record-keeping subsystem, kept together so it backs up as a unit:
##     .../keys                 the ring that seals the trail, which maintains itself
##     .../audit                the trail, when it is kept here rather than in the log stream
##     .../secrets              material resolved by the `directory` secret provider
##     .../state                what the server remembers about its own configuration
##   <working_dir>/tls          certificates and keys the listeners present
##   <working_dir>/data         whatever the store keeps
##
## A realm hosts the same `operations/` subsystem under `realms/<name>/operations/`, and — once it
## issues tokens — its own signing keys at `realms/<name>/keys`.

# working_dir: /var/lib/pic-x

## Whether this deployment is somebody's laptop.
##
## The single switch every relaxation is justified against, so there is one place to read which of
## the two kinds of deployment you are looking at. It permits: generating missing material, admitting
## any client the authority signed, and key windows shorter than a verifier's cache.

# development_mode: false

## Whether the server may create material it was not given — a pseudonymisation secret, a local
## certificate authority, a server certificate, a client certificate.
##
## Refused unless `development_mode` is also on. A server that mints its own authority is trusted by
## nobody, and that must not be one variable away from production.

# autogenerate: false

## ---------------------------------------------------------------------------------------------
## Realms — hosting more than one issuer
## ---------------------------------------------------------------------------------------------
##
## Everything above configures one server. A deployment that hosts several issuers — several tenants —
## declares each as a realm: its own token-signing keys, its own audit trail, its own pseudonymisation
## key, served at `/realms/<name>/`. The server itself issues nothing; it lists the realms and signs
## the system trail. Leave this out for a single-issuer deployment; it is served under the root.
##
## A realm inherits every server setting it does not state, and overrides only what it does:
##
##   - `keys`         its own token-signing ring — what it signs the tokens it issues with. Mandatory:
##                    signing policy is security, never inherited from `operations.keys` nor defaulted,
##                    so every realm states its full lifecycle (publish_ahead, rotate_every, retain).
##   - `exchange_profiles`
##                    realm-scoped Token Exchange Profiles. They say which upstream JWT access tokens
##                    this realm accepts, how they are validated, and how their claims become PIC
##                    execution invariants. There is deliberately no common profile block: two realms
##                    that integrate the same IdP still declare their own policy.
##   - `attesters`   realm-scoped Proof-of-Relationship attestation issuers. The realm document lists
##                    them at `attestations_endpoint`; advancement validation later fetches/checks
##                    their key material and accepted schemas from this trust source.
##   - `operations`   its override of the shared `operations` block below — the keys that seal its
##                    trail, the trail itself, and its pseudonymisation. Same shape as the top level.
##   - `issuer`       defaults to `{public.url}/realms/<name>`; set it only when the realm lives on
##                    its own host, as `acme` does here. `globex` states only its name.
##
## Whatever the policy, a realm's keys, trail and pseudonymisation key stay in its own directory,
## `realms/<name>/`, isolated from the server's and from each other.
##
## Realms can also live one per file, in a directory this file names. Each file is one complete
## realm — the same shape as one `realms:` entry below — and is named after it (`acme.yml` declares
## `acme`), so the directory listing is the realm listing. Files load in name order, after the
## realms declared inline here. Anything surprising refuses to start naming the culprit: a directory
## that is not there, a file that does not parse, a file named one thing declaring another, a name
## already taken, or a visible entry that is not a realm file. The path resolves against this file's
## own directory — realm files are configuration and travel with it — and, like `realms:`, it is
## file-only: no environment or command-line spelling.

# realms_from: realms.d

# realms:
#   - name: acme
#     issuer: https://acme.example.com
#     listed: true
#     # How long the PIC Tokens this realm issues stay valid. Stated per realm because the
#     # lifetime of issued authority is a deployment decision, not something to default.
#     token_lifetime: 1h
#     # How the initial PIC Token expiration is chosen during OAuth-to-PIC exchange, when the source
#     # token carries an expiration of its own: `later` (the default) takes whichever absolute
#     # expiration is later, `pic` always takes this realm's `token_lifetime`, `oauth` takes the
#     # source token's expiration whenever it has one.
#     token_initial_expiry_policy: later
#     # How long cached IdP and attester key sets stay usable once refreshing them starts failing.
#     # Default: 1h. The window buys tolerance to an upstream outage; when it runs out, tokens from
#     # that source are refused rather than checked against keys nobody vouches for anymore.
#     key_cache_stale_for: 1h
#     # The JOSE algorithm this realm signs its tokens and COSE artifacts with: `EdDSA` (the
#     # default) or `ES256`.
#     token_signing_algorithm: EdDSA
#     keys:
#       publish_ahead: 1h
#       rotate_every: 90d
#       retain: 400d
#     exchange_profiles:
#       - id: corporate-oauth-to-pic
#         source:
#           token_type: oauth-access-token
#           format: jwt
#           issuer: https://idp.example.com
#           # Where this deployment fetches the provider's OpenID Connect discovery, when that
#           # address differs from the issuer identity — a service mesh, a container network, a NAT.
#           # Identity is not an address. Absent, discovery is fetched from the issuer URL itself.
#           discovery_url: https://idp.internal.example.com
#           audience: pic-x
#           validation:
#             allowed_algorithms:
#               - ES256
#             require_expiration: true
#             require_token_type: at+jwt
#         claims:
#           identity_context:
#             type:
#               value: user
#             id:
#               from: sub
#             roles:
#               from: roles
#               type: set
#             groups:
#               from: groups
#               type: set
#             securityDomain:
#               from: tenant_id
#           scopes:
#             from: scope
#             encoding: space-delimited
#             type: set
#         privileges:
#           source: scopes
#           rules:
#             - name: resource-instance
#               priority: 10
#               pattern: '^(?<resourceType>[a-z][a-z0-9_-]*):(?<operation>[a-z][a-z0-9_-]*):(?<resourceId>[a-zA-Z0-9_-]+)$'
#               emit:
#                 scope: '${raw}'
#                 operation: '${operation}'
#                 resource_type: '${resourceType}'
#                 resource_id: '${resourceId}'
#             - name: resource-collection
#               priority: 1
#               pattern: '^(?<resourceType>[a-z][a-z0-9_-]*):(?<operation>[a-z][a-z0-9_-]*)$'
#               emit:
#                 scope: '${raw}'
#                 operation: '${operation}'
#                 resource_type: '${resourceType}'
#                 resource_id: '*'
#         on_unmatched_scope: reject
#     attesters:
#       - id: corporate-por-attester
#         issuer: https://attestation.example.com
#         jwks_uri: https://attestation.example.com/jwks.json
#         proof_types:
#           - sd-jwt
#         formats:
#           - sd-jwt
#     operations:
#       audit:
#         retention: 365d
#   - name: globex
#     listed: true
#     token_lifetime: 1h
#     keys:
#       publish_ahead: 1h
#       rotate_every: 30d
#       retain: 365d

## A realm may also resolve its pseudonymisation key from the environment instead of its directory:
##
##   operations:
##     secrets:
##       provider: environment
##
## resolving it from `PIC_X_SECRET_ACME_AUDIT_PSEUDONYM` by default — the server's prefix suffixed with
## the realm, so two realms cannot collide on one variable.
##
## `listed` is fail-closed. A realm appears in the public catalogue at
## `/.well-known/server-configuration` only if it opts in — a deployment does not enumerate its
## tenants to the world by default. An unlisted realm is still reachable at its own path, because a
## client verifying a token must be able to fetch that realm's keys.
##
## The whole model, the endpoints and the on-disk layout are in docs/realms.md.

## ---------------------------------------------------------------------------------------------
## The public surface
## ---------------------------------------------------------------------------------------------
##
## The only surface that faces the world, and therefore the one with the least on it: discovery
## documents and the published key set. Anything that changes state lives on the administrative
## surface, on another port, behind mutual TLS.
##
## One address. Whether it is plain HTTP or HTTPS is decided by the `tls` block below, not by a second
## address — the ports are deliberately not Dex's 5556/5557/5558, so both can run on one host.

# public:
#   http: 0.0.0.0:7556

##   The public URL clients are told to reach this deployment at — what clients are told, not what the
##   process binds: behind a proxy the deployment is reached at a name the process never sees, and no
##   proxy header is trustworthy enough to derive it from. Realm issuers default to
##   `{url}/realms/<name>`. It must be https — clients trust this URL and fetch keys from it (RFC
##   8414), so outside development mode a plain-http one is refused, loopback included; the listener
##   below may still be plain http behind something that terminates TLS. Left unset, discovery
##   advertises relative paths, which is never wrong.

#   url: https://pic-x.example.com

##   Where the surface is mounted. Empty — the root — unless a proxy forwards a path unstripped, which
##   most do not: they strip it, and the advertised URL comes from `public.url` instead.

#   path_prefix: ""

##   The certificate this surface presents. Relative paths resolve inside the volume.
##
##   `client_ca` turns TLS into mutual TLS: a client that presents no certificate, or one that
##   authority did not sign, never reaches the application. `crl` is what lets the authority take a
##   certificate back before it expires — without it, a compromised client stays valid until its
##   expiry date, which is exactly the window an attacker was hoping for.
##
##   Naming a `crl` without a `client_ca` is refused: it reads as stricter than it is.

#   tls:
#     cert: tls/server.pem
#     key: tls/server.key
#     client_ca: tls/ca.pem
#     crl: tls/ca.crl
##     1.2 is available and has to be asked for by name. The default is 1.3.
#     min_version: "1.3"

## ---------------------------------------------------------------------------------------------
## Telemetry
## ---------------------------------------------------------------------------------------------
##
## Liveness, readiness and metrics, on a port of its own so a scrape never travels through whatever
## the public surface is behind. It offers no `client_ca`, on purpose: it is read by a collector and
## probed by a kubelet, and neither of those has a client identity to present.

# telemetry:
#   addr: 0.0.0.0:7558
#   tls:
#     cert: tls/server.pem
#     key: tls/server.key
#     min_version: "1.3"

## ---------------------------------------------------------------------------------------------
## The administrative surface
## ---------------------------------------------------------------------------------------------
##
## gRPC, and everything that changes the state of a deployment. Two questions are answered here, in
## two places, and conflating them is the mistake this section exists to prevent.
##
## The handshake answers *who is this*: mutual TLS, so a client with no certificate never reaches the
## application. `allow` answers *may they* — because one authority signs every client it was built
## for, and a surface that stops at the handshake has admitted all of them.
##
## Binding this to an address outside the host without `tls.client_ca` is refused before anything
## binds. Loopback is the other way to satisfy that — reachable only from inside the host, so no
## client certificate is demanded. The shipped production file takes the first way: it binds this
## off-host behind mutual TLS and an `allow` list, which is how a real deployment is administered.

# admin:
#   addr: 127.0.0.1:7557
#   tls:
#     cert: tls/server.pem
#     key: tls/server.key
#     client_ca: tls/ca.pem
#     crl: tls/ca.crl
#     min_version: "1.3"

##   Who may administer this deployment. Each entry is one of:
##
##     cn:local-operator            the common name — survives renewal, and trusts the authority not
##                                  to issue that name to somebody else
##     dn:CN=operator,O=PIC-X       the whole subject, exactly
##     sha256:<64 hex>              one certificate and nothing else — cannot be impersonated, and has
##                                  to be updated every time it is renewed
##
##   Leaving it empty while mutual TLS is on is refused outside development mode.

#   allow:
#     - cn:local-operator

## ---------------------------------------------------------------------------------------------
## Transport material while the server runs
## ---------------------------------------------------------------------------------------------
##
## Certificates are renewed on a schedule nobody controls from inside this process. Re-reading is on
## by default because the alternative is a restart every ninety days — or, far more often, a
## certificate that quietly expires because nobody wanted the restart.
##
## SIGHUP re-reads everything immediately, which is what a renewal hook should send. A reload that
## cannot build the new material keeps the material already in use: a warning, never an outage.

# tls:
#   reload: true
#   reload_interval: 30s

## ---------------------------------------------------------------------------------------------
## Limits
## ---------------------------------------------------------------------------------------------
##
## What a surface refuses to spend, whoever is asking. These apply to every surface — public,
## administrative and telemetry — and every one of them has a default, so a deployment that says
## nothing here is still bounded. They are here to be *lowered* in front of a hostile network, or
## raised for a surface that genuinely serves more than this.
##
##   connections          sockets held at once. Stops a client opening thousands and leaving them:
##                        each costs a task and a TLS session, and a client that sends nothing on
##                        them spends none of the request budget. Over the limit is refused, never
##                        queued — waiting for a slot would hold the socket that is the resource
##   handshake_timeout    how long a client has to finish TLS. Stops a handshake started and never
##                        completed. Shorter than request_timeout on purpose: a handshake that may
##                        last as long as a whole request is a cheaper way to hold one open
##   header_timeout       how long a client has to send a complete request head. This is the one that
##                        answers slowloris — a client dribbling `GET / HTTP/1.1` one byte at a time
##                        never reaches a handler, so nothing a handler is wrapped in can time it out
##   request_timeout      how long one request may take once it has arrived, answered 408. Stops a
##                        body, or a handler, that never ends
##   concurrent_requests  requests in flight at once. Over it the answer is 503 immediately, not a
##                        place in a queue — a queue under overload fails slowly for everybody
##                        instead of quickly for the requests that were not going to be served
##   body_bytes           bytes read from one body, answered 413. Stops a megabyte announced and a
##                        gigabyte sent. Accepts `k`, `M` and `G`
##
## None of these is a rate limiter. Rate limiting needs to know who a client *is* over time, which
## is a decision about identity rather than about resources, and belongs in front of this.
##
## `connections` is per surface, and this process runs three. A deployment raising it should raise the
## file descriptor limit with it: three surfaces at 1024 is 3072 sockets, and a container whose
## `RLIMIT_NOFILE` is 1024 will run out long before any of these limits is reached.

# limits:
#   connections: 1024
#   concurrent_requests: 256
#   request_timeout: 30s
#   handshake_timeout: 10s
#   header_timeout: 10s
#   body_bytes: 1M

## ---------------------------------------------------------------------------------------------
## Logging
## ---------------------------------------------------------------------------------------------
##
## `json` is for a log pipeline and suppresses the banner; `terminal` is for a human watching it.
## `debug` adds the starting/stopping transitions that `info` leaves out.

# log:
#   level: info
#   format: json

## ---------------------------------------------------------------------------------------------
## Shutdown
## ---------------------------------------------------------------------------------------------
##
## How long everything gets to be released before the process exits regardless. Thirty seconds is
## what Kubernetes gives a pod between SIGTERM and SIGKILL, so a longer budget is one the orchestrator
## never honours.

# shutdown:
#   timeout: 30s

## ---------------------------------------------------------------------------------------------
## Operations — the record-keeping subsystem
## ---------------------------------------------------------------------------------------------
##
## The keys that seal a trail, the trail itself, and the secret that pseudonymises it — the server's
## own, and the defaults every realm inherits (a realm overrides parts in its own `operations:`). On
## disk this is `operations/`; see "The volume" above.

# operations:

## Secrets — where secret material is resolved from. Nothing here is itself a secret: it says where
## to look, and the store says what is there.
##
##   directory    one file per key, named after it — which is both what a mounted Kubernetes secret
##                looks like from inside a container and what the server writes when it generates one
##   environment  one variable per key. Weaker: the environment of a process is readable by anything
##                that can read /proc and is inherited by every child
##   none         no store at all, and anything that needs one refuses to start
##
## `directory` defaults to `<working_dir>/operations/secrets`, so the same file works whether the
## material was mounted or generated. Set it only to read from somewhere outside the volume. A build
## that needs Vault, a KMS or an HSM adds it in its own composition root — nothing here changes.

#   secrets:
#     provider: directory
#     directory: operations/secrets
#     env_prefix: PIC_X_SECRET

## The audit trail
##
##   sink: tracing   records go into the log stream, and from there wherever it goes. Right when
##                   something else is already responsible for keeping them; it has no integrity of
##                   its own
##   sink: file      records are kept here: one file per UTC day, each carrying the digest of the one
##                   before it, so an edit, a removed line or a missing day stops the chain verifying
##
## That is tamper *evidence*, not prevention: anyone who can write the files can rewrite the chain
## from where they changed it, and the result verifies against itself.
##
## What catches *that* is the **seal**. Every day the trail closes, the head is written beside it and
## emitted to the log stream — and, when `keys` below is on, signed. The log stream leaves this
## machine, so the attestation does too: anyone holding an earlier seal can tell that the trail no
## longer agrees with it, and check the signature against the published key set without trusting the
## machine that produced it.
##
## `pic-x audit verify --directory <dir> [--keys <jwks>]` checks all of it.
##
## It is still not proof against somebody who owns the host, because the signing key is on the same
## volume. Making it so means keeping the key somewhere they cannot reach — which is what the key
## manager contract exists to allow.

#   audit:
#     sink: file
#     directory: operations/audit
#     retention: 90d

##   Audit subjects that are people can be recorded as pseudonyms instead of masked. Masking hides a
##   person and loses the trail with them; a pseudonym keeps the trail and drops the identity.
##
##   `key_ref` is the *name* of the key in the secret store, never the key — which is what keeps this
##   file free of anything worth stealing and moves rotation to where keys live.
##
##   Rotating means changing the key **and** `key_version` together. The server remembers what each
##   version produces for one fixed input and refuses to start if a version ever produces something
##   else, because doing one without the other fails silently and ruins the trail slowly.

#     pseudonym:
#       enabled: true
#       key_ref: audit-pseudonym
#       key_version: "v1"

## Signing keys — the operations ring
##
## What seals the trail. Its public half is reached through the administrative surface, not served
## over HTTP. (A realm signs the tokens it issues with a separate ring — its own `keys` block — which
## *is* published, at the realm's `jwks_uri`, and has the same lifecycle knobs.) A key is published
## before it signs and its public half is kept after it stops — a signature naming a key nobody has
## fetched fails until caches refresh, and a signature made yesterday has to keep verifying tomorrow.
## The private half is deleted at `retain`; the public half stays until the audit retention, so seals
## keep verifying.
##
##   publish_ahead  how long a new key sits in the set before it signs. Must be at least as long as
##                  the cache the set is served with (300s), or verifiers reject good signatures for
##                  the difference. Refused outside development mode
##   rotate_every   how long a key signs before it is replaced. Must be longer than publish_ahead
##   retain         how long a retired key stays published — the answer to "how far back must a
##                  signature still verify". Must be at least rotate_every, or there is a gap
##   maintenance_interval  how often the lifecycle is advanced. One loop maintains every ring — the
##                  server's and each realm's — so this is a single server-wide cadence, and a realm's
##                  `rotate_every` can never take effect faster than it. 60s by default; development
##                  lowers it to a second or two to watch a rotation happen
##
## The first key of a fresh deployment signs immediately: publishing ahead protects verifiers that
## already cached something, and a deployment starting for the first time has none.

#   keys:
#     enabled: true
#     directory: operations/keys
#     publish_ahead: 1h
#     rotate_every: 30d
#     retain: 365d
#     maintenance_interval: 60s
