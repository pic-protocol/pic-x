# PIC-X — development, in a single container, over TLS and mutual TLS.
#
#   task run-as-docker-tls   builds the image and runs it against this file,
#                            mounted at /etc/pic-x/config.yml — the image itself ships no configuration
#
# The same as config.docker.yml, plus the transport security a real deployment has. Still nothing to
# set up first: the authority, the server certificate and the operator's client certificate are all
# generated into the mounted volume on the first start, and on the host they land under
# `.volume-docker-tls/`:
#
#   curl --cacert .volume-docker-tls/tls/ca.pem https://localhost:7556/.well-known/jwks.json
#   grpcurl -cacert .volume-docker-tls/tls/ca.pem \
#           -cert .volume-docker-tls/tls/client.pem -key .volume-docker-tls/tls/client.key \
#           -import-path crates/pic-x-admin/proto -proto picx/admin/v1/admin.proto \
#           localhost:7557 picx.admin.v1.Admin/GetVersion
#
# and, more to the point, a client certificate that authority signed but which is not named below is
# refused with PERMISSION_DENIED. That is the difference between authentication and authorisation,
# and it is worth seeing once.

development_mode: true
autogenerate: true

# The volume the image declares. Mount something over it to keep what a run produced.
working_dir: /var/lib/pic-x

log:
  # `debug` shows the starting and stopping transitions; `json` because a container's output goes to a
  # collector even when the container is on your laptop.
  level: debug
  format: json

public:
  # Every address is 0.0.0.0 rather than loopback: loopback inside a container means the container,
  # which is not where you are.
  http: 0.0.0.0:7556
  # The public base over TLS; realm issuers derive from it as `{url}/realms/<name>`.
  url: https://localhost:7556
  tls:
    # Relative to the volume. Generated on the first start.
    cert: tls/server.pem
    key: tls/server.key

telemetry:
  addr: 0.0.0.0:7558
  tls:
    cert: tls/server.pem
    key: tls/server.key

admin:
  addr: 0.0.0.0:7557
  tls:
    cert: tls/server.pem
    key: tls/server.key
    # The generated authority. Its presence is what turns TLS into mutual TLS.
    client_ca: tls/ca.pem
    # The list that authority publishes, generated alongside it and revoking nothing yet. It is here
    # so the revocation path is configured and therefore exercised: a list that revokes nothing and
    # no list at all are opposite things to a listener, and only one of them is checked.
    crl: tls/ca.crl
  allow:
    # The common name the generated client certificate carries. Without this line, development mode
    # would admit every client the generated authority signed — which is nobody else here, and is
    # still the wrong habit to demonstrate.
    - cn:local-operator

# The shared record-keeping subsystem: sealing keys, trail, pseudonymisation. Realms inherit it.
operations:
  keys:
    enabled: true
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    # Resolves to /var/lib/pic-x/operations/secrets, where the generated pseudonymisation key lands.
    provider: directory
  audit:
    # On disk and chained, so `pic-x audit verify` has something to check after the run.
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"

# Two example realms, both listed, issuers derived from `public.url` over TLS. Generated material
# (token keys, operations keys, trail, pseudonymisation key) lands under realms/<name>/ in the
# volume on first start.
realms:
  - name: acme
    # How long the PIC Tokens this realm issues stay valid. Stated per realm because the
    # lifetime of issued authority is a deployment decision, not something to default.
    token_lifetime: 1h
    listed: true
    # Each realm states its own token-signing `keys` (signing policy is not inherited). acme rotates
    # fast and keeps its trail longer; globex takes plainer values.
    keys:
      publish_ahead: 5m
      rotate_every: 30m
      retain: 12h
    operations:
      audit:
        retention: 30d
  - name: globex
    # How long the PIC Tokens this realm issues stay valid. Stated per realm because the
    # lifetime of issued authority is a deployment decision, not something to default.
    token_lifetime: 1h
    listed: true
    keys:
      publish_ahead: 5m
      rotate_every: 1h
      retain: 1d
