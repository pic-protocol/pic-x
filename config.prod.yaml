# PIC-X — production, and what the container image runs by default.
#
#   task run-as-docker   builds the image and runs it against this file
#   the image            copies it to /etc/pic-x/config.yaml and runs it unless told otherwise
#
# This file describes a deployment that has been given what it needs, and it **will not start without
# it**. That is deliberate and it is the difference from config.dev.yaml: a production default that
# quietly serves plain HTTP and admits every client is a footgun, because the first thing anybody does
# with an image is run it and the second is assume it is configured.
#
# So running this image with nothing mounted fails, on purpose, naming what is missing:
#
#   validating the web TLS material: the TLS certificate /var/lib/pic-x/tls/server.pem is not a
#   readable file
#
# Nothing here is generated. `development_mode` and `autogenerate` are absent, so a server that is
# missing something says so instead of inventing it — a process that mints its own authority is
# trusted by nobody.
#
# Every setting there is, with its consequences, is in config.template.yaml.

working_dir: /var/lib/pic-x

log:
  level: info
  format: json

# What has to be in the volume before this starts:
#
#   tls/server.pem     the certificate every surface presents
#   tls/server.key     its private key
#   tls/operators.pem  the authority that signed the operators allowed to administer this deployment
#   secrets/audit-pseudonym   the key audit subjects are pseudonymised with, 32 random bytes
#
# In Kubernetes those are two mounted secrets. There is no step that produces them here, and that is
# the point: material this process could create is material nobody else has to trust.

# The public URL clients are told to reach this deployment at — your ingress or proxy, not the address
# below. Left unset, the discovery document advertises relative paths, which is never wrong and is
# rarely useful. Only a loopback address may be plain http.
#
# issuer: https://pic-x.example.com

web:
  http: 0.0.0.0:7556

  # Remove this block, and only this block, when something in front already terminates TLS. Behind an
  # ingress that does, running in the clear is correct rather than lazy — but it has to be a decision
  # somebody made, which is why it is on by default and taken away by hand.
  tls:
    cert: tls/server.pem
    key: tls/server.key
    min_version: "1.3"

telemetry:
  addr: 0.0.0.0:7558

  # Metrics describe the inside of the process and health says when it is struggling. Neither is
  # secret exactly, and neither belongs on the wire in the clear.
  #
  # A Kubernetes probe against this needs `scheme: HTTPS` in the probe spec, and a Prometheus scrape
  # needs the authority; both are one line, and both are easier to add than to notice missing.
  tls:
    cert: tls/server.pem
    key: tls/server.key
    min_version: "1.3"

grpc:
  # Reachable, because everything that changes the state of this deployment happens here and an
  # administrative surface only its own host can reach is one nobody can operate.
  #
  # Off loopback this address is refused before anything binds unless `tls.client_ca` is set — and
  # `client_ca` alone is refused too, because one authority signs every client it was built for and a
  # surface that stops at the handshake has admitted all of them. Both, or loopback. Nothing between.
  addr: 0.0.0.0:7557

  tls:
    cert: tls/server.pem
    key: tls/server.key
    client_ca: tls/operators.pem
    min_version: "1.3"

    # What the authority has taken back. Commented out because a revocation list is something an
    # authority publishes and re-publishes, and a file that demands one before it starts cannot be
    # satisfied by any deployment that has not set that up yet.
    #
    # Set it as soon as there is one. Without it, a compromised operator certificate stays valid until
    # it expires on its own, which is exactly the window an attacker was hoping for.
    #
    # crl: tls/operators.crl

  # Who may administer this deployment. Being signed by the authority above is authentication; being
  # named here is authorisation, and they are not the same question.
  #
  # Change this to the operators you actually issued certificates to. Left as it is, nobody can
  # administer this deployment — which is the right way for a placeholder to be wrong.
  allow:
    - cn:pic-x-operator

# Where secret material is resolved from. `directory` reads one file per key, which is what a mounted
# Kubernetes secret looks like, and defaults to <working_dir>/secrets.
secrets:
  provider: directory

audit:
  # Kept here and chained, so that an edit, a removed line or a missing day stops the chain verifying.
  # Switch to `tracing` when something else is already collecting the log stream durably and is
  # responsible for keeping it.
  sink: file
  retention: 90d

  # Recording people as pseudonyms rather than masking them keeps the trail answerable — "did this
  # account do that" — without putting an identifier in it. It resolves `audit-pseudonym` from the
  # secret store above and refuses to start without it.
  #
  # Rotating means changing the key **and** `key_version` together. The server remembers what each
  # version produces for one fixed input and refuses to start if a version ever produces something
  # else, because doing one without the other fails silently and ruins the trail slowly.
  pseudonym:
    enabled: true
    key_ref: audit-pseudonym
    key_version: "v1"

keys:
  # What this deployment signs with, published at /.well-known/jwks.json and maintained here: a key is
  # published before it signs and stays published after it stops, because a verifier caches the set.
  #
  # `publish_ahead` must be at least the 300s that set is served with — shorter is refused outside
  # development mode, because it makes verifiers reject good signatures.
  enabled: true
  publish_ahead: 1h
  rotate_every: 30d
  retain: 365d

# The issuers this deployment hosts, one realm each, both listed so both appear in the public
# catalogue. Set each `issuer` to the tenant's real public URL. Because this file does not
# autogenerate, each realm's pseudonymisation key must be provided at realms/<name>/secrets/
# audit-pseudonym, exactly as the server's is — the server refuses to start without it. See
# docs/realms.md.
realms:
  - name: acme
    issuer: https://acme.example.com
    listed: true
    # acme keeps its trail longer and rotates less often than the server default; globex
    # inherits everything. Both still need their own secrets/audit-pseudonym provided.
    keys:
      rotate_every: 90d
      retain: 400d
    audit:
      retention: 365d
  - name: globex
    issuer: https://globex.example.com
    listed: true
