version: '3'

# Tasks are kept in alphabetical order, so a reader scanning the file finds them in series.
tasks:
  audit:verify:
    desc: Check that nothing in the audit trail has been altered.
    summary: |
      Read the file audit trail and check record digests, sequence continuity, day boundaries and
      seals.

      With KEYS, each seal's signature is checked too. Point it at a key set you trust — checking a
      seal against keys taken from the machine under suspicion checks a signature against a key the
      same attacker could have replaced:

        task audit:verify KEYS=./trusted.jwks

      Examples:
        task audit:verify
        task audit:verify VOLUME=/tmp/pic-x
        task audit:verify KEYS=./trusted.jwks

      Parameters:
        VOLUME  Where everything lives. Default: .volume beside the repository.
        KEYS    A JWKS document to check the seals' signatures against. Default: unset.

      See docs/audit.md for the audit guide.
    vars:
      VOLUME: '{{.VOLUME | default ".volume"}}'
      KEYS: '{{.KEYS | default ""}}'
    cmds:
      - >-
        cargo run --quiet --bin pic-x -- audit verify --directory {{.VOLUME}}/audit
        {{if .KEYS}}--keys {{.KEYS}}{{end}}

  bench:
    desc: Run the benchmarks.
    summary: |
      Run the benchmarks.

      Examples:
        task bench
        task bench BENCH=server_host
        task bench PKG=pic-x-server
        task bench ARGS='--all-features'

      Parameters:
        PKG     Benchmark only this workspace crate. Default: the whole workspace.
        BENCH   Only run this benchmark target (`--bench <name>`). Default: all targets.
        FILTER  Only run benchmarks whose name contains this string. Default: all benchmarks.
        ARGS    Extra flags appended verbatim to `cargo bench`. Default: empty.
    vars:
      PKG: '{{.PKG | default ""}}'
      BENCH: '{{.BENCH | default ""}}'
      FILTER: '{{.FILTER | default ""}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - >-
        cargo bench {{if .PKG}}-p {{.PKG}}{{else}}--workspace{{end}}
        {{if .BENCH}}--bench {{.BENCH}}{{end}} {{.ARGS}} {{.FILTER}}

  build:
    desc: Build every component.
    summary: |
      Build every component.

      Examples:
        task build
        task build PKG=pic-x-core
        task build RELEASE=1
        task build ARGS='--all-features'

      Parameters:
        PKG      Build only this workspace crate. Default: the whole workspace.
        RELEASE  Build with the release profile when set to any value. Default: unset.
        ARGS     Extra flags appended verbatim to `cargo build`. Default: empty.
    vars:
      PKG: '{{.PKG | default ""}}'
      RELEASE: '{{.RELEASE | default ""}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - >-
        cargo build {{if .PKG}}-p {{.PKG}}{{else}}--workspace{{end}}
        {{if .RELEASE}}--release{{end}} {{.ARGS}}

  check:
    desc: Run every check the pipeline runs.
    summary: |
      Run lint, both structural checks, the supply-chain gates and the test suite, in that order.

      Example:
        task check

      Parameters: none.
    cmds:
      - task: lint
      - task: check:seams
      - task: check:core-deps
      - task: check:supply-chain
      - task: test

  check:core-deps:
    desc: Check that pic-x-core keeps its dependency list minimal.
    summary: |
      Check that pic-x-core keeps its dependency list minimal.

      Every crate depends on pic-x-core, including the ones a downstream build writes. Whatever
      lands in its dependency list lands in all of them, so the list is an allowlist.

      Example:
        task check:core-deps

      Parameters: none.
    cmds:
      - ./scripts/check-core-dependencies.sh

  check:seams:
    desc: Check that only the binary constructs swappable collaborators.
    summary: |
      Check that only the binary constructs swappable collaborators.

      Every crate here receives its collaborators instead of resolving them, which is what lets
      another binary reuse these crates and replace the parts it needs. Nothing in the type system
      enforces that, so it is checked here.

      Example:
        task check:seams

      Parameters: none.
    cmds:
      - ./scripts/check-composition-root.sh

  check:supply-chain:
    desc: Check the dependency tree for advisories, licences and unknown sources.
    summary: |
      Check every crate this workspace pulls in: known advisories, unmaintained crates, licences
      outside the permissive set, and anything from a registry nobody named.

      The rules live in deny.toml, and each of them exists for a reason written down beside it. An
      exception belongs in that file with an id and a justification, so it is reviewable rather than
      invisible.

      Example:
        task check:supply-chain

      Parameters: none.
    cmds:
      - cargo deny check

  cli:
    desc: Run the pic-x binary with arbitrary arguments.
    summary: |
      Run the pic-x binary with arbitrary arguments.

      This is the escape hatch for invocations the named tasks do not cover — a command added later,
      or a flag combination worth trying once. `task run-as-local` stays the way to start the server.

      Both spellings work and mean the same thing: everything after `--`, and whatever `ARGS` holds.
      The `--` form is here because it is what fingers type; the named form is here because it is what
      the other tasks use.

      Examples:
        task cli -- --help
        task cli ARGS=--help
        task cli ARGS=version
        task cli -- ./my-config.yml --admin-addr 0.0.0.0:6000
        task cli RELEASE=1 ARGS=--version

      Parameters:
        ARGS     Arguments passed verbatim to the binary. Default: empty, which prints usage.
        RELEASE  Run the release build when set to any value. Default: unset.
    vars:
      ARGS: '{{.ARGS | default ""}}'
      RELEASE: '{{.RELEASE | default ""}}'
    cmds:
      - cargo run {{if .RELEASE}}--release{{end}} --bin pic-x -- {{.CLI_ARGS}} {{.ARGS}}

  lab-demo:
    desc: Run the local lab walkthrough.
    silent: true
    summary: |
      Run the didactic lab walkthrough. It checks that Keycloak, PIC-X and trust-lab are reachable,
      requests an example IdP token and prints the token with a short explanation of what happened.

      Start the lab first with `task lab-up`.

      Examples:
        task lab-demo
        task lab-demo ARGS=--print-tokens
        task lab-demo ARGS=--interactive
    vars:
      PYTHON: '{{.PYTHON | default "python3"}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - '{{.PYTHON}} trust-lab/scripts/pic-x-demo.py {{.ARGS}}'

  lab-demo-interactive:
    desc: Run the local lab walkthrough step by step with HTTP packet traces.
    silent: true
    summary: |
      Run the didactic lab walkthrough in guided mode. It pauses before each exchange, prints the
      OAuth access token, PIC Token JWTs, Continuity/PCA payloads, execution contract, the real HTTP
      requests and responses, and the local workload process outputs used by the exchanges.

      Start the lab first with `task lab-up`.

      Examples:
        task lab-demo-interactive
    vars:
      PYTHON: '{{.PYTHON | default "python3"}}'
    cmds:
      - '{{.PYTHON}} trust-lab/scripts/pic-x-demo.py --interactive'

  lab-demo-print:
    desc: Run the local lab walkthrough and print decoded token/PIC artifact values.
    silent: true
    summary: |
      Run the didactic lab walkthrough with token and PIC artifact inspection enabled.

      Start the lab first with `task lab-up`.

      Examples:
        task lab-demo-print
    vars:
      PYTHON: '{{.PYTHON | default "python3"}}'
    cmds:
      - '{{.PYTHON}} trust-lab/scripts/pic-x-demo.py --print-tokens'

  lab-down:
    desc: Stop the local Docker Compose lab.
    silent: true
    summary: |
      Stop and remove the local compose stack.

      Examples:
        task lab-down
    cmds:
      - docker compose -f docker-compose.lab.yml down

  lab-get-idp-config:
    desc: Print the local Keycloak IdP well-known configuration.
    silent: true
    summary: |
      Request the OpenID Connect well-known configuration from the local Keycloak lab and print the
      raw JSON response.

      Start the lab first with `task lab-up`.

      Examples:
        task lab-get-idp-config

      Parameters:
        KEYCLOAK_URL    Base URL. Default: http://localhost:18080.
        KEYCLOAK_REALM  Realm name. Default: acme-idp.
    vars:
      KEYCLOAK_URL: '{{.KEYCLOAK_URL | default "http://localhost:18080"}}'
      KEYCLOAK_REALM: '{{.KEYCLOAK_REALM | default "acme-idp"}}'
    cmds:
      - >-
        curl -fsS
        "{{.KEYCLOAK_URL}}/realms/{{.KEYCLOAK_REALM}}/.well-known/openid-configuration"

  lab-get-idp-jwt:
    desc: Print a JWT from the local Keycloak lab.
    silent: true
    summary: |
      Request an access token from the local Keycloak lab and print only the JWT.

      Start the lab first with `task lab-up`.

      Examples:
        task lab-get-idp-jwt
        task lab-get-idp-jwt KEYCLOAK_USERNAME=alice KEYCLOAK_PASSWORD=alice-password

      Parameters:
        KEYCLOAK_URL            Base URL. Default: http://localhost:18080.
        KEYCLOAK_REALM          Realm name. Default: acme-idp.
        KEYCLOAK_CLIENT_ID      Client ID. Default: acme-idp-client.
        KEYCLOAK_CLIENT_SECRET  Client secret. Default: acme-idp-client-secret.
        KEYCLOAK_USERNAME       Username. Default: alice.
        KEYCLOAK_PASSWORD       Password. Default: alice-password.
    vars:
      KEYCLOAK_URL: '{{.KEYCLOAK_URL | default "http://localhost:18080"}}'
      KEYCLOAK_REALM: '{{.KEYCLOAK_REALM | default "acme-idp"}}'
      KEYCLOAK_CLIENT_ID: '{{.KEYCLOAK_CLIENT_ID | default "acme-idp-client"}}'
      KEYCLOAK_CLIENT_SECRET: '{{.KEYCLOAK_CLIENT_SECRET | default "acme-idp-client-secret"}}'
      KEYCLOAK_USERNAME: '{{.KEYCLOAK_USERNAME | default "alice"}}'
      KEYCLOAK_PASSWORD: '{{.KEYCLOAK_PASSWORD | default "alice-password"}}'
    cmds:
      - >-
        curl -fsS -X POST
        "{{.KEYCLOAK_URL}}/realms/{{.KEYCLOAK_REALM}}/protocol/openid-connect/token"
        -H "Content-Type: application/x-www-form-urlencoded"
        --data-urlencode "grant_type=password"
        --data-urlencode "client_id={{.KEYCLOAK_CLIENT_ID}}"
        --data-urlencode "client_secret={{.KEYCLOAK_CLIENT_SECRET}}"
        --data-urlencode "username={{.KEYCLOAK_USERNAME}}"
        --data-urlencode "password={{.KEYCLOAK_PASSWORD}}"
        | sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'

  lab-run-demo:
    desc: Alias for lab-demo.
    silent: true
    cmds:
      - task: lab-demo

  lab-up:
    desc: Start the local Docker Compose lab.
    silent: true
    summary: |
      Start the local compose stack. It imports the `acme-idp` example IdP realm into Keycloak,
      exposes Keycloak on localhost:18080, builds PIC-X from the local source with config.lab.yml,
      and builds the local trust-lab REST service on localhost:17080.

      Examples:
        task lab-up

      See docs/keycloak.md for credentials and lab commands.
    cmds:
      # One directory per service, so the lab's state can be read from the host while it runs.
      - mkdir -p .volume-docker-compose/pic-x .volume-docker-compose/trust-lab .volume-docker-compose/keycloak
      - chmod -R a+rwX .volume-docker-compose
      - docker compose -f docker-compose.lab.yml up --build -d

  lint:
    desc: Run clippy over every crate and target.
    summary: |
      Run clippy over every crate and target, failing on any warning.

      Examples:
        task lint
        task lint PKG=pic-x-server
        task lint ARGS=--fix

      Parameters:
        PKG   Lint only this workspace crate. Default: the whole workspace.
        ARGS  Extra flags appended verbatim to `cargo clippy`. Default: empty.
    vars:
      PKG: '{{.PKG | default ""}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - >-
        cargo clippy {{if .PKG}}-p {{.PKG}}{{else}}--workspace{{end}}
        --all-targets --all-features {{.ARGS}} -- -D warnings

  release:
    desc: Tag the next release, push the tag and publish the release notes — after a y at the prompt.
    silent: true
    summary: |
      Read the latest `v<major>.<minor>.<patch>` tag (after fetching the remote's), bump the patch,
      and — only after a `y` at the prompt, which lists the commits going in — create the annotated
      tag `v<version>` (message: `pic-x v<version>`), push it to origin, and publish the GitHub
      release. Its notes are the commit subjects since the previous tag, with GitHub's generated
      "What's Changed" section (merged pull requests) underneath. Anything other than `y` aborts
      with nothing created.

      With VERSION, tag exactly that version instead: how a minor or major release is cut.

      Examples:
        task release
        task release VERSION=0.4.0
        task release DRAFT=1
        task release YES=1

      Parameters:
        VERSION  The exact version to tag, e.g. 0.4.0. Default: the latest tag, patch bumped.
        DRAFT    Publish the release as a draft, to edit and release by hand. Default: unset.
        YES      Skip the summary and the question: one line, then the release happens. The
                 dirty-tree, duplicate-tag and version checks still apply. Default: unset.
    vars:
      VERSION: '{{.VERSION | default ""}}'
      DRAFT: '{{.DRAFT | default ""}}'
      YES: '{{.YES | default ""}}'
    cmds:
      - DRAFT={{.DRAFT}} YES={{.YES}} ./scripts/release.sh {{.VERSION}}

  run-as-docker:
    desc: Build the image and run it as a single container — no transport security.
    summary: |
      Build the image and run it as one container against config.docker.yml, mounted at
      /etc/pic-x/config.yml — the image itself ships no configuration.

      It starts from an empty volume and generates development material on first start. It has no TLS
      and no admin client certificate; do not run it where the ports are reachable by somebody else.

      Once it is up:

        curl http://localhost:7556/.well-known/jwks.json
        curl http://localhost:7558/metrics

        grpcurl -plaintext \
                -import-path crates/pic-x-admin/proto -proto picx/admin/v1/admin.proto \
                localhost:7557 picx.admin.v1.Admin/GetVersion

      Examples:
        task run-as-docker
        task run-as-docker VOLUME=/tmp/pic-x-docker
        task run-as-docker TAG=pic-x:experiment

      Parameters:
        TAG     Image tag to build and run. Default: pic-x:local.
        VOLUME  Host directory mounted as the volume. Default: .volume-docker.

      See docs/docker.md for the container guide.
    vars:
      TAG: '{{.TAG | default "pic-x:local"}}'
      VOLUME: '{{.VOLUME | default ".volume-docker"}}'
      CONFIG: '{{.CONFIG | default "config.docker.yml"}}'
    cmds:
      - docker build --tag {{.TAG}} .
      - mkdir -p {{.VOLUME}}
      # The mount point, and nothing inside it: the container writes as uid 65532 and needs the
      # directory. Recursing would loosen the secret it wrote on the last run, and the secret store
      # would then refuse to read it — correctly.
      - chmod a+rwX {{.VOLUME}}
      - >-
        docker run --rm --init
        --publish 7556:7556 --publish 7557:7557 --publish 7558:7558
        --volume "$(pwd)/{{.CONFIG}}:/etc/pic-x/config.yml:ro"
        --volume "$(pwd)/{{.VOLUME}}:/var/lib/pic-x"
        {{.TAG}}

  run-as-docker-tls:
    desc: The same single container, over TLS with mutual TLS on the administrative surface.
    summary: |
      Build the image and run it as one container against config.docker-tls.yml, mounted at
      /etc/pic-x/config.yml — the image itself ships no configuration.

      The first start generates a local authority, a server certificate and an operator client
      certificate into the volume, `.volume-docker-tls/` on the host. Once it is up:

        curl --cacert .volume-docker-tls/tls/ca.pem https://localhost:7556/.well-known/jwks.json

        grpcurl -cacert .volume-docker-tls/tls/ca.pem \
                -cert .volume-docker-tls/tls/client.pem -key .volume-docker-tls/tls/client.key \
                -import-path crates/pic-x-admin/proto -proto picx/admin/v1/admin.proto \
                localhost:7557 picx.admin.v1.Admin/GetVersion

      Examples:
        task run-as-docker-tls
        task run-as-docker-tls VOLUME=/tmp/pic-x-docker-tls

      Parameters: the same as `task run-as-docker`, with VOLUME defaulting to .volume-docker-tls.
      See docs/docker.md for the container guide.
    vars:
      TAG: '{{.TAG | default "pic-x:local"}}'
      VOLUME: '{{.VOLUME | default ".volume-docker-tls"}}'
      CONFIG: '{{.CONFIG | default "config.docker-tls.yml"}}'
    cmds:
      - docker build --tag {{.TAG}} .
      - mkdir -p {{.VOLUME}}
      # The mount point, and nothing inside it: the container writes as uid 65532 and needs the
      # directory. Recursing would loosen the secret it wrote on the last run, and the secret store
      # would then refuse to read it — correctly.
      - chmod a+rwX {{.VOLUME}}
      - >-
        docker run --rm --init
        --publish 7556:7556 --publish 7557:7557 --publish 7558:7558
        --volume "$(pwd)/{{.CONFIG}}:/etc/pic-x/config.yml:ro"
        --volume "$(pwd)/{{.VOLUME}}:/var/lib/pic-x"
        {{.TAG}}

  run-as-local:
    desc: Run the server locally — everything on, nothing to set up first.
    summary: |
      Start the server against config.local.yml.

      It is a local development run: loopback only, no TLS, readable logs and `.volume/` created on
      first start. Serving is the binary's default action, so the direct form is `pic-x <CONFIG>`.

      See docs/start-server.md for the full startup guide.

      Examples:
        task run-as-local
        task run-as-local CONFIG=./my-config.yml
        task run-as-local LOG_LEVEL=trace
        task run-as-local ADMIN_ADDR=127.0.0.1:6000

      Parameters:
        CONFIG            Configuration file. Default: config.local.yml.
        LOG_LEVEL         error, warn, info, debug, or trace. Default: whatever CONFIG says.
        LOG_FORMAT        json or terminal. Default: whatever CONFIG says.
        RELEASE           Run the release build when set to any value. Default: unset.
        PUBLIC_HTTP_ADDR  Override the public listen address. Default: from CONFIG.
        TELEMETRY_ADDR    Override the telemetry listen address. Default: from CONFIG.
        ADMIN_ADDR        Override the admin listen address. Default: from CONFIG.
        ARGS              Extra flags appended verbatim to the invocation. Default: empty.
    cmds:
      - task: serve
        vars:
          CONFIG: '{{.CONFIG | default "config.local.yml"}}'
          LOG_LEVEL: '{{.LOG_LEVEL}}'
          LOG_FORMAT: '{{.LOG_FORMAT}}'
          RELEASE: '{{.RELEASE}}'
          PUBLIC_HTTP_ADDR: '{{.PUBLIC_HTTP_ADDR}}'
          TELEMETRY_ADDR: '{{.TELEMETRY_ADDR}}'
          ADMIN_ADDR: '{{.ADMIN_ADDR}}'
          ARGS: '{{.ARGS}}'

  run-as-local-tls:
    desc: The same local run, over TLS with mutual TLS on the administrative surface.
    summary: |
      Start the server against config.local-tls.yml.

      The first start generates a local authority, a server certificate and an operator client
      certificate under `.volume/tls/`. Once it is up:

        curl --cacert .volume/tls/ca.pem https://localhost:7556/.well-known/jwks.json

        grpcurl -cacert .volume/tls/ca.pem \
                -cert .volume/tls/client.pem -key .volume/tls/client.key \
                -import-path crates/pic-x-admin/proto -proto picx/admin/v1/admin.proto \
                localhost:7557 picx.admin.v1.Admin/GetVersion

      Examples:
        task run-as-local-tls
        task run-as-local-tls LOG_FORMAT=json

      Parameters: the same as `task run-as-local`, with CONFIG defaulting to config.local-tls.yml.
      See docs/start-server.md for the full startup guide.
    cmds:
      - task: serve
        vars:
          CONFIG: '{{.CONFIG | default "config.local-tls.yml"}}'
          LOG_LEVEL: '{{.LOG_LEVEL}}'
          LOG_FORMAT: '{{.LOG_FORMAT}}'
          RELEASE: '{{.RELEASE}}'
          PUBLIC_HTTP_ADDR: '{{.PUBLIC_HTTP_ADDR}}'
          TELEMETRY_ADDR: '{{.TELEMETRY_ADDR}}'
          ADMIN_ADDR: '{{.ADMIN_ADDR}}'
          ARGS: '{{.ARGS}}'

  serve:
    internal: true
    desc: Start the server against a named configuration file.
    vars:
      CONFIG: '{{.CONFIG | default "config.local.yml"}}'
      LOG_LEVEL: '{{.LOG_LEVEL | default ""}}'
      LOG_FORMAT: '{{.LOG_FORMAT | default ""}}'
      RELEASE: '{{.RELEASE | default ""}}'
      PUBLIC_HTTP_ADDR: '{{.PUBLIC_HTTP_ADDR | default ""}}'
      TELEMETRY_ADDR: '{{.TELEMETRY_ADDR | default ""}}'
      ADMIN_ADDR: '{{.ADMIN_ADDR | default ""}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - >-
        cargo run {{if .RELEASE}}--release{{end}} --bin pic-x -- {{.CONFIG}}
        {{if .LOG_LEVEL}}--log-level {{.LOG_LEVEL}}{{end}}
        {{if .LOG_FORMAT}}--log-format {{.LOG_FORMAT}}{{end}}
        {{if .PUBLIC_HTTP_ADDR}}--public-http-addr {{.PUBLIC_HTTP_ADDR}}{{end}}
        {{if .TELEMETRY_ADDR}}--telemetry-addr {{.TELEMETRY_ADDR}}{{end}}
        {{if .ADMIN_ADDR}}--admin-addr {{.ADMIN_ADDR}}{{end}}
        {{.ARGS}}

  test:
    desc: Run the unit and use-case tests.
    summary: |
      Run the unit and use-case tests.

      Examples:
        task test
        task test PKG=pic-x-core
        task test FILTER=test_validate
        task test FILTER=test_validate NOCAPTURE=1
        task test RELEASE=1 ARGS='--all-features'

      Parameters:
        PKG        Test only this workspace crate. Default: the whole workspace.
        FILTER     Only run tests whose name contains this string. Default: all tests.
        NOCAPTURE  Show test stdout/stderr when set to any value. Default: unset.
        RELEASE    Test the release profile when set to any value. Default: unset.
        FEATURES   Feature selection. Default: --all-features, so nothing is silently skipped —
                   `pic-x-std` keeps `provision` outside its default set, and a plain `cargo test`
                   would never compile the tests that cover it.
        ARGS       Extra flags appended verbatim to `cargo test`. Default: empty.
    vars:
      PKG: '{{.PKG | default ""}}'
      FILTER: '{{.FILTER | default ""}}'
      NOCAPTURE: '{{.NOCAPTURE | default ""}}'
      RELEASE: '{{.RELEASE | default ""}}'
      FEATURES: '{{.FEATURES | default "--all-features"}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - >-
        cargo test {{if .PKG}}-p {{.PKG}}{{else}}--workspace{{end}}
        {{.FEATURES}} {{if .RELEASE}}--release{{end}} {{.ARGS}} {{.FILTER}}
        {{if .NOCAPTURE}}-- --nocapture{{end}}

  version:
    desc: Report the product version.
    summary: |
      Report the product version.

      Example:
        task version

      Parameters: none.
    cmds:
      - task: cli
        vars:
          ARGS: version
