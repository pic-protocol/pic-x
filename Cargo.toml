[package]
name = "pic-x"
description = "PIC-X — Provenance Identity Continuity Exchange."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
build = "build.rs"
autobenches = false

# The product lives at the root and the libraries live under `crates/`, which is the layout `ripgrep`
# and `cargo` itself use. It says the thing that matters at a glance: everything under `crates/` is
# meant to be depended on, and this is not. Nobody adds `pic-x` to their `Cargo.toml`; they add
# `pic-x-core` and compose their own binary.
[[bin]]
name = "pic-x"
path = "src/main.rs"

[dependencies]
pic-x-admin.workspace = true
pic-x-audit.workspace = true
pic-x-core.workspace = true
pic-x-keys.workspace = true
anyhow.workspace = true
pic-x-provision.workspace = true
pic-x-pseudonym.workspace = true
pic-x-secrets.workspace = true
pic-x-server.workspace = true
pic-x-storage.workspace = true
pic-x-telemetry.workspace = true
pic-x-transport.workspace = true
pic-x-wellknown.workspace = true
tokio.workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

# Every crate here is a contract or an implementation of one. The only crate that picks concrete
# implementations is the `pic-x` binary: it is the composition root, and `scripts/check-composition-root.sh`
# keeps it that way. A downstream binary can therefore reuse any subset of these crates and supply
# its own implementation of the rest without forking.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
repository = "https://github.com/pic-protocol/pic-x"

[workspace.dependencies]
pic-x-admin = { path = "crates/pic-x-admin", version = "0.1.0" }
pic-x-audit = { path = "crates/pic-x-audit", version = "0.1.0" }
pic-x-core = { path = "crates/pic-x-core", version = "0.1.0" }
pic-x-keys = { path = "crates/pic-x-keys", version = "0.1.0" }
pic-x-provision = { path = "crates/pic-x-provision", version = "0.1.0" }
pic-x-pseudonym = { path = "crates/pic-x-pseudonym", version = "0.1.0" }
pic-x-secrets = { path = "crates/pic-x-secrets", version = "0.1.0" }
pic-x-server = { path = "crates/pic-x-server", version = "0.1.0" }
pic-x-storage = { path = "crates/pic-x-storage", version = "0.1.0" }
pic-x-telemetry = { path = "crates/pic-x-telemetry", version = "0.1.0" }
pic-x-transport = { path = "crates/pic-x-transport", version = "0.1.0" }
pic-x-wellknown = { path = "crates/pic-x-wellknown", version = "0.1.0" }

anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dialoguer = "0.11"
futures-core = "0.3"
getrandom = "0.3"
hmac = "0.12"
http = "1"
indicatif = "0.17"
prost = "0.14"
rcgen = "0.14"
# The same signing and random-number implementation `rustls` already links, so the key ring adds an
# algorithm rather than a second cryptographic stack to review.
ring = "0.17"
# `tls12` is what makes the 1.2 floor available at all; the default floor is still 1.3.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tonic = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
# Reading the subject and serial a client certificate asserts. `rustls` proves the certificate was
# signed by an authority we trust; it deliberately says nothing about who the certificate is for.
x509-parser = "0.17"
# `derive` is what makes zeroizing a struct field a declaration rather than a Drop impl to get right.
zeroize = { version = "1", features = ["derive"] }
