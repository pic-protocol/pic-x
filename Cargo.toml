[package]
name = "pic-x"
description = "PIC-X — Provenance Identity Continuity Exchange."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
autobenches = false

# The product lives at the root and the libraries live under `crates/`, which is the layout `ripgrep`
# and `cargo` itself use. It says the thing that matters at a glance: everything under `crates/` is
# meant to be depended on, and this is not. Nobody adds `pic-x` to their `Cargo.toml`; they add
# `pic-x-core` and compose their own binary.
[[bin]]
name = "pic-x"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
pic-x-admin.workspace = true
pic-x-core.workspace = true
pic-x-server.workspace = true
# `provision` is outside the default set — it is the implementation that can mint a certificate
# authority, so asking for it is written down here rather than inherited.
pic-x-std = { workspace = true, features = [
    "audit",
    "keys",
    "metrics",
    "pseudonym",
    "secrets",
    "storage",
    # Outside the default set: it is the implementation that can mint a certificate authority, so
    # asking for it is written down here rather than inherited by naming the crate.
    "provision",
] }
pic-x-telemetry.workspace = true
pic-x-transport.workspace = true
pic-x-wellknown.workspace = true
# Reading a published key set back, to check what the audit trail's seals were signed with.
serde_json.workspace = true
tokio.workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

# Every crate here is a contract or an implementation of one. The only crate that picks concrete
# implementations is the `pic-x` binary: it is the composition root, and `scripts/check-composition-root.sh`
# keeps it that way. A downstream binary can therefore reuse any subset of these crates and supply
# its own implementation of the rest without forking.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
# The SPDX expression, which is what crates.io, every licence scanner and every downstream compliance
# review actually read. `license-file` alone leaves all of them saying "unknown"; declaring both makes
# cargo ask which one is authoritative, and for a standard licence the answer is this one. The text
# itself still ships — in the repository, and in the image at /usr/share/doc/pic-x.
license = "Apache-2.0"
repository = "https://github.com/pic-protocol/pic-x"

[workspace.dependencies]
pic-x-admin = { path = "crates/pic-x-admin", version = "0.1.0" }
pic-x-core = { path = "crates/pic-x-core", version = "0.1.0" }
pic-x-server = { path = "crates/pic-x-server", version = "0.1.0" }
# `default-features = false` at the root so every member states which areas it uses, rather than
# inheriting all of them and linking dependencies it never touches. A crate outside this workspace
# still gets the default set by writing `pic-x-std = "0.1"`.
pic-x-std = { path = "crates/pic-x-std", version = "0.1.0", default-features = false }
pic-x-telemetry = { path = "crates/pic-x-telemetry", version = "0.1.0" }
pic-x-transport = { path = "crates/pic-x-transport", version = "0.1.0" }
pic-x-wellknown = { path = "crates/pic-x-wellknown", version = "0.1.0" }

anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dialoguer = "0.11"
futures-core = "0.3"
hmac = "0.12"
http = "1"
# The Tokio timer hyper needs before any of its own timeouts do anything. Already in the tree
# beneath `axum-server`; named here because this workspace configures the connection builder.
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
indicatif = "0.17"
prost = "0.14"
rcgen = "0.14"
# The same signing and random-number implementation `rustls` already links, so the key ring adds an
# algorithm rather than a second cryptographic stack to review.
ring = "0.17"
# `tls12` is what makes the 1.2 floor available at all; the default floor is still 1.3.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tonic = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
# The timeout and body-size layers. `default-features = false` because the crate's default set pulls
# in tracing, compression and a good deal else that nothing here asks for.
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout"] }
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
# Reading the subject and serial a client certificate asserts. `rustls` proves the certificate was
# signed by an authority we trust; it deliberately says nothing about who the certificate is for.
x509-parser = "0.17"
# `derive` is what makes zeroizing a struct field a declaration rather than a Drop impl to get right.
zeroize = { version = "1", features = ["derive"] }
