# PIC-X — local Docker Compose lab.
#
# This is intentionally HTTP-only and localhost-bound by docker-compose.lab.yml. It is here to make
# the lab easy to run on a fresh developer machine, not to model production transport security.

development_mode: true
autogenerate: true
working_dir: /var/lib/pic-x

log:
  level: debug
  format: json

public:
  http: 0.0.0.0:7556
  url: http://localhost:17556

telemetry:
  addr: 0.0.0.0:7558

admin:
  addr: 0.0.0.0:7557

operations:
  keys:
    enabled: true
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    provider: directory
  audit:
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"

realms:
  - name: acme
    listed: true
    keys:
      publish_ahead: 5m
      rotate_every: 30m
      retain: 12h
    exchange_profiles:
      - id: acme-keycloak-oauth-to-pic
        source:
          token_type: oauth-access-token
          format: jwt
          issuer: http://localhost:18080/realms/acme-idp
          audience: pic-x
          validation:
            allowed_algorithms:
              - RS256
            require_expiration: true
            require_token_type: JWT
        claims:
          identity_context:
            type:
              value: user
            id:
              from: sub
            roles:
              from: realm_access.roles
              type: set
            securityDomain:
              value: acme
          scopes:
            from: pic_scopes
            type: set
        privileges:
          source: scopes
          rules:
            - name: resource-instance
              priority: 10
              pattern: '^(?<resourceType>[a-z][a-z0-9_-]*):(?<operation>[a-z][a-z0-9_-]*):(?<resourceId>[a-zA-Z0-9_-]+)$'
              emit:
                scope: '${raw}'
                operation: '${operation}'
                resource_type: '${resourceType}'
                resource_id: '${resourceId}'
            - name: resource-collection
              priority: 1
              pattern: '^(?<resourceType>[a-z][a-z0-9_-]*):(?<operation>[a-z][a-z0-9_-]*)$'
              emit:
                scope: '${raw}'
                operation: '${operation}'
                resource_type: '${resourceType}'
                resource_id: '*'
        on_unmatched_scope: reject
    attesters:
      # `issuer` is the identity the attester puts in the SD-JWT `iss`, as seen from the host;
      # `jwks_uri` is where PIC-X fetches its keys from, and PIC-X runs inside the compose network,
      # so it reaches the trust lab by service name rather than through the published host port.
      - id: acme-por-attester
        issuer: http://localhost:17080/attesters/acme-por-attester
        jwks_uri: http://trust-lab:7080/attesters/acme-por-attester/jwks.json
        proof_types:
          - sd-jwt
        formats:
          - sd-jwt
