# PIC-X — development, in a single container.
#
#   task run-as-docker   builds the image and runs it against this file,
#                        mounted at /etc/pic-x/config.yml — the image itself ships no configuration
#
# This file starts with an empty volume and nothing else prepared. What it gives up to start
# unattended: transport security. There is no TLS here and no client certificate on the
# administrative surface, so anything that can reach the ports is admitted. That is only permitted
# because `development_mode` is on, and the server says so in the log every time it starts. Do not
# run it anywhere the ports are reachable by somebody else.
#
# What it keeps: signing keys that rotate, an audit trail chained on disk, pseudonymised subjects.
# Those are what a local run needs to exercise, and none of them needs anything mounted.
#
# For the same container over TLS and mutual TLS, use config.docker-tls.yml. For what a real
# deployment looks like, copy from config.template.yml.

# This is a container somebody is trying, and says so. It is what permits the line below, the
# administrative surface without a client certificate, and the key windows further down.
development_mode: true

# Create what is missing: the pseudonymisation secret, and the first signing key. Nothing already in
# the volume is ever overwritten, so a second run continues where the first left off.
autogenerate: true

# The volume the image declares. Mount something over it to keep what a run produced.
working_dir: /var/lib/pic-x

log:
  # `debug` shows the starting and stopping transitions; `json` because a container's output goes to a
  # collector even when the container is on your laptop.
  level: debug
  format: json

public:
  # Every address is 0.0.0.0 rather than loopback: loopback inside a container means the container,
  # which is not where you are.
  http: 0.0.0.0:7556
  # The public base; realm issuers derive from it as `{url}/realms/<name>`.
  url: http://localhost:7556

telemetry:
  addr: 0.0.0.0:7558

admin:
  # Reachable, and authorising nobody. On any other configuration this is refused before anything
  # binds — an administrative surface off loopback without `tls.client_ca` is exactly the mistake the
  # validation exists to stop. `development_mode` is what makes it an allowed choice here, and the
  # server logs `admin.unauthenticated` on every start so it can never be a quiet one.
  addr: 0.0.0.0:7557

# The shared record-keeping subsystem: sealing keys, trail, pseudonymisation. Realms inherit it.
operations:
  keys:
    enabled: true
    # Short windows for development — an hour, not a month — so a rotation happens within a working
    # session. The maintenance loop's default 60s tick is fine here; lower `maintenance_interval` only
    # to watch a rotation live. A sub-300s `publish_ahead` would break a real verifier, but there are
    # none here and `development_mode` allows it.
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    # Resolves to /var/lib/pic-x/operations/secrets, where the generated pseudonymisation key lands.
    provider: directory
  audit:
    # On disk and chained, so `pic-x audit verify` has something to check after the run.
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"

# Two example realms — two issuers hosted by one server — so a container run demonstrates the
# multi-tenant shape. Both listed, so both appear in /.well-known/server-configuration; each derives
# its issuer from `public.url`. Each gets its own token keys, operations keys, trail and
# pseudonymisation key under realms/<name>/, generated on first start. A single-issuer deployment
# leaves this out. See docs/realms.md.
realms:
  - name: acme
    # How long the PIC Tokens this realm issues stay valid. Stated per realm because the
    # lifetime of issued authority is a deployment decision, not something to default.
    token_lifetime: 1h
    # Which expiration wins at OAuth-to-PIC exchange: `later` (the default, stated here so the
    # choice is visible), `pic` for this realm's `token_lifetime`, `oauth` for the source token's
    # own. globex below says nothing and takes the default.
    token_initial_expiry_policy: later
    listed: true
    # Every realm states its own token-signing `keys` (signing policy is not inherited); operations
    # blocks it omits are inherited.
    keys:
      publish_ahead: 5m
      rotate_every: 30m
      retain: 12h
    exchange_profiles:
      - id: acme-keycloak-oauth-to-pic
        source:
          token_type: oauth-access-token
          format: jwt
          issuer: http://localhost:18080/realms/acme-idp
          audience: account
          validation:
            allowed_algorithms:
              - RS256
            require_expiration: true
            require_token_type: JWT
        claims:
          identity_context:
            type:
              value: user
            id:
              from: sub
            roles:
              from: realm_access.roles
              type: set
            securityDomain:
              value: acme
          scopes:
            from: pic_scopes
            type: set
        privileges:
          source: scopes
          rules:
            - name: resource-instance
              priority: 10
              pattern: '^(?<resourceType>[a-z][a-z0-9_-]*):(?<operation>[a-z][a-z0-9_-]*):(?<resourceId>[a-zA-Z0-9_-]+)$'
              emit:
                scope: '${raw}'
                operation: '${operation}'
                resource_type: '${resourceType}'
                resource_id: '${resourceId}'
            - name: resource-collection
              priority: 1
              pattern: '^(?<resourceType>[a-z][a-z0-9_-]*):(?<operation>[a-z][a-z0-9_-]*)$'
              emit:
                scope: '${raw}'
                operation: '${operation}'
                resource_type: '${resourceType}'
                resource_id: '*'
        on_unmatched_scope: reject
    attesters:
      - id: acme-por-attester
        issuer: http://localhost:17080/attesters/acme-por-attester
        jwks_uri: http://localhost:17080/attesters/acme-por-attester/jwks.json
        proof_types:
          - sd-jwt
        formats:
          - sd-jwt
    operations:
      audit:
        retention: 30d
  - name: globex
    # How long the PIC Tokens this realm issues stay valid. Stated per realm because the
    # lifetime of issued authority is a deployment decision, not something to default.
    token_lifetime: 1h
    listed: true
    keys:
      publish_ahead: 5m
      rotate_every: 1h
      retain: 1d
    exchange_profiles:
      - id: globex-oauth-to-pic
        source:
          token_type: oauth-access-token
          format: jwt
          issuer: https://idp.globex.example.com
          audience: pic-x
          validation:
            allowed_algorithms:
              - ES256
            require_expiration: true
            require_token_type: at+jwt
        claims:
          identity_context:
            type:
              value: user
            id:
              from: sub
          scopes:
            from: scope
            encoding: space-delimited
            type: set
        privileges:
          source: scopes
          rules:
            - name: resource-instance
              priority: 10
              pattern: '^(?<resourceType>[a-z][a-z0-9_-]*):(?<operation>[a-z][a-z0-9_-]*):(?<resourceId>[a-zA-Z0-9_-]+)$'
              emit:
                scope: '${raw}'
                operation: '${operation}'
                resource_type: '${resourceType}'
                resource_id: '${resourceId}'
            - name: resource-collection
              priority: 1
              pattern: '^(?<resourceType>[a-z][a-z0-9_-]*):(?<operation>[a-z][a-z0-9_-]*)$'
              emit:
                scope: '${raw}'
                operation: '${operation}'
                resource_type: '${resourceType}'
                resource_id: '*'
        on_unmatched_scope: reject
    attesters:
      - id: globex-por-attester
        issuer: https://attestation.globex.example.com
        jwks_uri: https://attestation.globex.example.com/jwks.json
        proof_types:
          - sd-jwt
        formats:
          - sd-jwt
