name: pic-x-compose-lab

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0}
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-19000}:9000"
    volumes:
      - ./dev/keycloak/acme-idp-realm.json:/opt/keycloak/data/import/acme-idp-realm.json:ro

  trust-lab:
    build:
      context: ./trust-lab
    environment:
      TRUST_LAB_BIND_ADDR: 0.0.0.0:7080
    ports:
      - "127.0.0.1:${TRUST_LAB_HTTP_PORT:-17080}:7080"
    depends_on:
      - keycloak
