name: pic-x-compose-lab

# Every service keeps its state under `.volume-docker-compose/<service>/`, so the lab can be
# inspected from the host while it runs — keys, artifacts, the audit trail — instead of hiding
# inside named volumes only `docker` can reach. Removing that directory resets the lab.

services:
  pic-x:
    build:
      context: .
    command:
      - /etc/pic-x/config.lab.yaml
    ports:
      - "127.0.0.1:${PIC_X_PUBLIC_PORT:-17556}:7556"
      - "127.0.0.1:${PIC_X_ADMIN_PORT:-17557}:7557"
      - "127.0.0.1:${PIC_X_TELEMETRY_PORT:-17558}:7558"
    volumes:
      - ./config.lab.yaml:/etc/pic-x/config.lab.yaml:ro
      - ./.volume-docker-compose/pic-x:/var/lib/pic-x
    # The realm fetches its attester and identity-provider key sets at startup; starting after both
    # means the first sweep succeeds rather than waiting out the refresh interval.
    depends_on:
      trust-lab:
        condition: service_started
      keycloak:
        condition: service_healthy

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0}
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # One issuer identity, whichever address reaches it. Without this, Keycloak names itself after
      # the host it was called on: `localhost:18080` for the demo script, `keycloak:8080` for PIC-X
      # inside the network — and a realm that fetches discovery internally would find a document
      # claiming an issuer its tokens never carry.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HTTP_PORT:-18080}
      # Backchannel URLs follow the address the request arrived on, while the issuer identity stays
      # fixed above. That is what lets PIC-X fetch `jwks_uri` at `keycloak:8080` from inside the
      # network while the tokens it verifies still say `localhost:18080`.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-19000}:9000"
    volumes:
      - ./dev/keycloak/acme-idp-realm.json:/opt/keycloak/data/import/acme-idp-realm.json:ro
      - ./.volume-docker-compose/keycloak:/opt/keycloak/data/h2

  trust-lab:
    build:
      context: ./trust-lab
    environment:
      TRUST_LAB_BIND_ADDR: 0.0.0.0:7080
      TRUST_LAB_PUBLIC_URL: http://localhost:${TRUST_LAB_HTTP_PORT:-17080}
      TRUST_LAB_CONFIG: /etc/trust-lab/config.lab.json
      TRUST_LAB_ARTIFACT_DIR: /var/lib/trust-lab/artifacts
    ports:
      - "127.0.0.1:${TRUST_LAB_HTTP_PORT:-17080}:7080"
    volumes:
      - ./trust-lab/config.lab.json:/etc/trust-lab/config.lab.json:ro
      - ./.volume-docker-compose/trust-lab:/var/lib/trust-lab
