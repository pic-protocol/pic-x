name: pic-x-compose-lab

services:
  pic-x:
    build:
      context: .
    command:
      - /etc/pic-x/config.lab.yaml
    ports:
      - "127.0.0.1:${PIC_X_PUBLIC_PORT:-17556}:7556"
      - "127.0.0.1:${PIC_X_ADMIN_PORT:-17557}:7557"
      - "127.0.0.1:${PIC_X_TELEMETRY_PORT:-17558}:7558"
    volumes:
      - ./config.lab.yaml:/etc/pic-x/config.lab.yaml:ro
      - pic-x-lab-data:/var/lib/pic-x
    # The realm fetches its attester key set at startup; starting after the trust lab means the
    # first sweep succeeds rather than waiting for the refresh interval.
    depends_on:
      - trust-lab

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.0}
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-19000}:9000"
    volumes:
      - ./dev/keycloak/acme-idp-realm.json:/opt/keycloak/data/import/acme-idp-realm.json:ro

  trust-lab:
    build:
      context: ./trust-lab
    environment:
      TRUST_LAB_BIND_ADDR: 0.0.0.0:7080
      TRUST_LAB_PUBLIC_URL: http://localhost:${TRUST_LAB_HTTP_PORT:-17080}
      TRUST_LAB_CONFIG: /etc/trust-lab/config.lab.json
      TRUST_LAB_ARTIFACT_DIR: /var/lib/trust-lab/artifacts
    ports:
      - "127.0.0.1:${TRUST_LAB_HTTP_PORT:-17080}:7080"
    volumes:
      - ./trust-lab/config.lab.json:/etc/trust-lab/config.lab.json:ro
      - ./.volume/trust-lab:/var/lib/trust-lab
    depends_on:
      - keycloak

volumes:
  pic-x-lab-data:
