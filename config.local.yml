# PIC-X — development, in the clear.
#
#   task run-as-local   starts the server against this file
#   VS Code             "pic-x: serve (local)"
#
# Everything the product does is on, so a local run exercises it. Nothing has to be set up first: the
# volume is created on start and whatever is missing inside it is generated.
#
# For the same thing over TLS and mutual TLS, use config.local-tls.yml.
# For what a real deployment looks like, copy from config.template.yml, which lists every setting.

# This is somebody's laptop, and says so. It is what permits the two lines below, and the key windows
# further down that are far shorter than any deployment would use.
development_mode: true

# Create what is missing: a pseudonymisation secret, a local authority, a server certificate for
# localhost, and a client certificate for reaching the administrative surface. Nothing already there
# is ever overwritten.
autogenerate: true

# Beside the repository, and ignored by git.
working_dir: .volume

log:
  # `debug` shows the starting/stopping transitions; `terminal` is readable by a human rather than by
  # a log pipeline, and brings the banner with it.
  level: debug
  format: terminal

public:
  http: 127.0.0.1:7556
  # The deployment's public base. Realm issuers default to `{url}/realms/<name>`, so the two
  # realms below need no `issuer` of their own.
  url: http://localhost:7556

telemetry:
  addr: 127.0.0.1:7558

admin:
  # Loopback, and no client certificate: the point of this file is to start with no ceremony. That is
  # only defensible because nothing outside this machine can reach it — the same address on 0.0.0.0
  # without `tls.client_ca` is refused before anything binds.
  addr: 127.0.0.1:7557

# The record-keeping subsystem, shared by the server and inherited by every realm: the keys that seal
# a trail, the trail itself, and the secret that pseudonymises it. A realm overrides any part in its
# own `operations:` block.
operations:
  keys:
    enabled: true
    # Short windows for development — an hour, not a month — so a rotation happens within a working
    # session. The maintenance loop's default 60s tick is fine here; lower `maintenance_interval` only
    # to watch a rotation live. A sub-300s `publish_ahead` would break a real verifier, but there are
    # none locally and `development_mode` allows it.
    publish_ahead: 5m
    rotate_every: 1h
    retain: 1d
  secrets:
    # Resolves to <working_dir>/operations/secrets, which is where the generated key lands.
    provider: directory
  audit:
    # Written under the volume and chained, so `task audit:verify` has something to check.
    sink: file
    retention: 7d
    pseudonym:
      enabled: true
      key_ref: audit-pseudonym
      key_version: "v1"

# Two example realms — two issuers hosted by one server — so `task run-as-local` shows the multi-tenant shape.
# Both are listed, so both appear in /.well-known/server-configuration; each derives its issuer from
# `public.url` above. Each gets its own token keys, operations keys, trail and pseudonymisation
# key under .volume/realms/<name>/, generated on first start.
realms:
  - name: acme
    # How long the PIC Tokens this realm issues stay valid. Stated per realm because the
    # lifetime of issued authority is a deployment decision, not something to default.
    token_lifetime: 1h
    listed: true
    # Every realm must state its own token-signing `keys` — signing policy is security, never
    # inherited or defaulted. acme rotates its tokens fast and keeps its trail longer than the shared
    # default (via the `operations` override) — watch it in .volume/realms/acme/.
    keys:
      publish_ahead: 5m
      rotate_every: 30m
      retain: 12h
    operations:
      audit:
        retention: 30d
  - name: globex
    # How long the PIC Tokens this realm issues stay valid. Stated per realm because the
    # lifetime of issued authority is a deployment decision, not something to default.
    token_lifetime: 1h
    listed: true
    keys:
      publish_ahead: 5m
      rotate_every: 1h
      retain: 1d
